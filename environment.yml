name: dart-twin
channels:
  - conda-forge
  - defaults
dependencies:
  # Core runtime
  - python=3.11
  - pip
  - numpy>=1.26
  - pillow>=10
  - opencv>=4.8

  # Reconstruction service API
  - fastapi>=0.115
  - uvicorn>=0.30
  - python-multipart>=0.0.9

  # COLMAP (conda-forge build includes CUDA-accelerated feature extraction,
  # matching, dense stereo and meshing where a CUDA-capable GPU + driver exist)
  - colmap>=3.9

  # Python packaging
  - pip:
      - pycolmap>=4.0,<5          # Python bindings for COLMAP (GPU SfM when CUDA present)
      - python-dotenv>=1.0

# ---------------------------------------------------------------------------
# Windows note: conda-forge does not redistribute the CUDA toolkit on Windows.
# CUDA acceleration is provided by the installed NVIDIA driver (CUDA 13.x UMD
# confirmed present via nvidia-smi). COLMAP's --use_gpu=1 / pycolmap
# device=Device.auto will bind to the GPU at runtime. On Linux, uncomment the
# line below to pull the CUDA toolkit from conda-forge:
#   - cudatoolkit=12.4
# ---------------------------------------------------------------------------
